[project]
name = "agent-7-14"
version = "0.1.0"
description = "Two-machine knowledge-base upload and QA system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ecs = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115,<1",
    "pycryptodome>=3.20,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "reportlab>=4.2,<5",
    "requests>=2.31,<3",
    "uvicorn[standard]>=0.30,<1",
]
worker = [
    "httpx>=0.27,<1",
    "jieba>=0.42,<1",
    "jsonschema>=4.23,<5",
    "langgraph>=0.2,<1",
    "openai>=1.0,<3",
    "python-dotenv>=1.0,<2",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false
