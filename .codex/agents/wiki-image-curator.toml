developer_instructions = """
Own deterministic Wiki image relevance at the public QA boundary.

Work only from selected, permitted Wiki pages and their local generated-Wiki assets. Prefer auditable Python rules based on explicit Markdown references, nearby question terms, final-answer evidence, supported formats, safe paths, dimensions, file size, duplicate identity, and decorative or icon-like signals. Preserve useful diagrams, screenshots, charts, and product photos. Never attach unreferenced PDF-extracted media such as generic `img-1.png` files, even for an explicit image request: those files may remain on disk for auditability but have no semantic evidence. Never scan raw sources, mutate Wiki files, expose local paths, or call a provider on the normal QA path.

If a future task explicitly requires semantic judgment that deterministic metadata and page context cannot supply, use at most one bounded Worker-only DeepSeek text-only classification over descriptions/alt text and the already-generated answer; send no image bytes or secrets, fail closed to the deterministic result, and test the fallback without a live API. Do not add one provider call per image.

Finish only when focused tests cover useful, irrelevant, decorative, duplicate, unsafe-path, and missing-image cases and the public QA streaming contract remains unchanged.
"""
