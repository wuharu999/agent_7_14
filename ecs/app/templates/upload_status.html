<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload status</title>
<style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:35px auto;padding:0 18px;background:#f5f7fb;color:#172033}.card{background:#fff;border:1px solid #dbe2ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #1f293711}.status-card{border-top:4px solid #2563eb}.status-heading{display:flex;align-items:center;gap:10px}.status-dot{width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:#2563eb}.status-card.active .status-dot{animation:pulse 1.3s ease-in-out infinite}.bar{height:16px;background:#e2e8f0;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa,#2563eb);background-size:200% 100%;width:0;transition:width .3s;border-radius:99px}.status-card.active .fill{animation:shimmer 1.5s linear infinite}.status-card.indeterminate .fill{width:35%!important;animation:indeterminate 1.4s ease-in-out infinite}.status-card.success{border-top-color:#22c55e}.status-card.success .status-dot,.status-card.success .fill{background:#22c55e}.status-card.error{border-top-color:#ef4444}.status-card.error .status-dot,.status-card.error .fill{background:#ef4444}.status-card.deleted{border-top-color:#64748b}.status-card.deleted .status-dot,.status-card.deleted .fill{background:#64748b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.metric{background:#f8fafc;padding:12px;border-radius:9px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:9px;vertical-align:top}.error{color:#b91c1c}.ok{color:#166534}code{overflow-wrap:anywhere}a{color:#2563eb}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes shimmer{to{background-position:-200% 0}}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}@keyframes indeterminate{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}@media (prefers-reduced-motion:reduce){.status-card.active .status-dot,.status-card.active .fill,.status-card.indeterminate .fill{animation:none}.fill{transition:none}}</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h1 data-i18n="title">Upload status</h1><label for="ui-language" class="sr-only">Interface language</label><select id="ui-language" aria-label="Interface language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></div><p><code id="id"></code></p>
<div id="status-card" class="card status-card active"><div class="status-heading"><span class="status-dot" aria-hidden="true"></span><h2 id="filename">Loading…</h2></div><p id="message"></p><div class="bar" role="progressbar" aria-label="Upload processing progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill" class="fill"></div></div><p><strong id="percent">0%</strong> · <span id="stage"></span></p><p id="error" class="error"></p></div>
<div class="card"><div class="grid"><div class="metric"><span data-i18n="total">Total</span><br><strong id="total">0</strong></div><div class="metric"><span data-i18n="queued">Queued</span><br><strong id="queued">0</strong></div><div class="metric"><span data-i18n="processing">Processing</span><br><strong id="processing">0</strong></div><div class="metric"><span data-i18n="completed">Completed</span><br><strong id="completed">0</strong></div><div class="metric"><span data-i18n="failed">Failed</span><br><strong id="failed">0</strong></div><div class="metric"><span data-i18n="deleted">Deleted</span><br><strong id="deleted">0</strong></div></div></div>
<div class="card"><h2 data-i18n="sourceFiles">Source files</h2><table><thead><tr><th data-i18n="source">Source</th><th data-i18n="status">Status</th><th data-i18n="generated">Generated wiki files / error</th></tr></thead><tbody id="sources"><tr><td colspan="3" data-i18n="waitingPublication">Waiting for Worker publication.</td></tr></tbody></table></div>
<p><a href="/upload" data-i18n="uploadAnother">Upload another file</a> · <a href="/manage" data-i18n="manageSources">Manage sources</a> · <a href="/" data-i18n="questionPage">Question page</a></p>
<script>
const uploadId='__UPLOAD_ID__';document.getElementById('id').textContent=uploadId;const statusCard=document.getElementById('status-card');const progressbar=document.querySelector('[role="progressbar"]');const uiLanguage=document.getElementById('ui-language');
const terminal=new Set(['completed','failed','partially_failed','sources_removed']);
const translations={en:{title:'Upload status',total:'Total',queued:'Queued',processing:'Processing',completed:'Completed',failed:'Failed',deleted:'Deleted',sourceFiles:'Source files',source:'Source',status:'Status',generated:'Generated wiki files / error',waitingPublication:'Waiting for Worker publication.',uploadAnother:'Upload another file',manageSources:'Manage sources',questionPage:'Question page'},'zh-CN':{title:'上传状态',total:'总数',queued:'排队中',processing:'处理中',completed:'已完成',failed:'失败',deleted:'已删除',sourceFiles:'源文件',source:'源文件',status:'状态',generated:'生成的 Wiki 文件 / 错误',waitingPublication:'等待 Worker 发布文件。',uploadAnother:'上传其他文件',manageSources:'管理源文件',questionPage:'问答页面'}};
const stageLabels={en:{uploaded_to_ecs:'Upload received by ECS',waiting_for_worker:'Waiting for Worker',queued_for_worker:'Queued for Worker',downloading:'Worker downloading file',extracting:'Extracting source files',publishing_sources:'Publishing source files',waiting_for_llm_wiki:'Waiting for LLM Wiki',queued_in_llm_wiki:'Queued in LLM Wiki',llm_wiki_ingestion:'LLM Wiki is ingesting sources',ingestion_completed:'Ingestion completed',ingestion_failed:'LLM Wiki ingestion failed',sources_removed:'Sources moved to trash'},'zh-CN':{uploaded_to_ecs:'ECS 已接收上传',waiting_for_worker:'等待 Worker',queued_for_worker:'已进入 Worker 队列',downloading:'Worker 正在下载文件',extracting:'正在解压源文件',publishing_sources:'正在发布源文件',waiting_for_llm_wiki:'等待 LLM Wiki',queued_in_llm_wiki:'已进入 LLM Wiki 队列',llm_wiki_ingestion:'LLM Wiki 正在处理源文件',ingestion_completed:'处理完成',ingestion_failed:'LLM Wiki 处理失败',sources_removed:'源文件已移入回收目录'}};
function tr(key){return(translations[uiLanguage.value]||translations.en)[key]||translations.en[key]||key}function applyLanguage(){document.documentElement.lang=uiLanguage.value;document.querySelectorAll('[data-i18n]').forEach(element=>element.textContent=tr(element.dataset.i18n));uiLanguage.setAttribute('aria-label',uiLanguage.value==='zh-CN'?'界面语言':'Interface language')}uiLanguage.value=localStorage.getItem('agent1_ui_language')||'en';applyLanguage();uiLanguage.onchange=()=>{localStorage.setItem('agent1_ui_language',uiLanguage.value);applyLanguage();refresh()};
function text(id,value){document.getElementById(id).textContent=value??''}
function updateVisualState(data,percent){const isTerminal=terminal.has(data.status);const isError=data.status==='failed'||data.status==='partially_failed'||data.status==='ingestion_failed';statusCard.className='card status-card '+(isTerminal?'':'active ')+(data.status==='completed'?'success':isError?'error':data.status==='sources_removed'?'deleted':'');if(data.percent===null||data.percent===undefined)statusCard.classList.add('indeterminate');progressbar.setAttribute('aria-valuenow',String(percent))}
async function refresh(){try{const response=await fetch('/api/uploads/'+encodeURIComponent(uploadId));const data=await response.json();if(!response.ok){statusCard.className='card status-card error';text('message',data.error||'Not found');return}text('filename',data.filename+' · '+data.team);text('message',data.message);text('stage',(stageLabels[uiLanguage.value]||stageLabels.en)[data.stage]||data.stage);text('error',data.error||'');const progress=data.progress||{};const percent=data.percent??(progress.total?Math.round(((progress.completed+progress.failed)/progress.total)*100):0);text('percent',percent+'%');document.getElementById('fill').style.width=percent+'%';updateVisualState(data,percent);for(const key of ['total','queued','processing','completed','failed','deleted'])text(key,progress[key]||0);const tbody=document.getElementById('sources');tbody.innerHTML='';if(!data.sources.length){tbody.innerHTML='<tr><td colspan="3">'+(uiLanguage.value==='zh-CN'?'尚未发布源文件。':'No source files published yet.')+'</td></tr>'}else{for(const source of data.sources){const row=document.createElement('tr');const details=source.error||((source.files_written||[]).join('\n'))||'-';row.innerHTML='<td><code></code></td><td></td><td><pre></pre></td>';row.querySelector('code').textContent=source.source_identity;row.children[1].textContent=source.status;row.querySelector('pre').textContent=details;tbody.appendChild(row)}}if(!terminal.has(data.status))setTimeout(refresh,2000)}catch(error){text('message',String(error));statusCard.classList.add('indeterminate');setTimeout(refresh,4000)}}refresh();
</script>
</body></html>
