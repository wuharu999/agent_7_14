<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload status</title>
<style>
body{font-family:system-ui,sans-serif;max-width:960px;margin:35px auto;padding:0 18px;background:#f5f7fb;color:#172033}.card{background:#fff;border:1px solid #dbe2ee;border-radius:14px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #1f293711}.bar{height:16px;background:#e2e8f0;border-radius:99px;overflow:hidden}.fill{height:100%;background:#2563eb;width:0;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.metric{background:#f8fafc;padding:12px;border-radius:9px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:9px;vertical-align:top}.error{color:#b91c1c}.ok{color:#166534}code{overflow-wrap:anywhere}a{color:#2563eb}</style>
</head>
<body>
<h1>Upload status</h1><p><code id="id"></code></p>
<div class="card"><h2 id="filename">Loading…</h2><p id="message"></p><div class="bar"><div id="fill" class="fill"></div></div><p><strong id="percent">0%</strong> · <span id="stage"></span></p><p id="error" class="error"></p></div>
<div class="card"><div class="grid"><div class="metric">Total<br><strong id="total">0</strong></div><div class="metric">Queued<br><strong id="queued">0</strong></div><div class="metric">Processing<br><strong id="processing">0</strong></div><div class="metric">Completed<br><strong id="completed">0</strong></div><div class="metric">Failed<br><strong id="failed">0</strong></div><div class="metric">Deleted<br><strong id="deleted">0</strong></div></div></div>
<div class="card"><h2>Source files</h2><table><thead><tr><th>Source</th><th>Status</th><th>Generated wiki files / error</th></tr></thead><tbody id="sources"><tr><td colspan="3">Waiting for Worker publication.</td></tr></tbody></table></div>
<p><a href="/upload">Upload another file</a> · <a href="/manage">Manage sources</a> · <a href="/">Question page</a></p>
<script>
const uploadId='__UPLOAD_ID__';document.getElementById('id').textContent=uploadId;
const terminal=new Set(['completed','failed','partially_failed','sources_removed']);
function text(id,value){document.getElementById(id).textContent=value??''}
async function refresh(){try{const response=await fetch('/api/uploads/'+encodeURIComponent(uploadId));const data=await response.json();if(!response.ok){text('message',data.error||'Not found');return}text('filename',data.filename+' · '+data.team);text('message',data.message);text('stage',data.stage);text('error',data.error||'');const progress=data.progress||{};const percent=data.percent??(progress.total?Math.round(((progress.completed+progress.failed)/progress.total)*100):0);text('percent',percent+'%');document.getElementById('fill').style.width=percent+'%';for(const key of ['total','queued','processing','completed','failed','deleted'])text(key,progress[key]||0);const tbody=document.getElementById('sources');tbody.innerHTML='';if(!data.sources.length){tbody.innerHTML='<tr><td colspan="3">No source files published yet.</td></tr>'}else{for(const source of data.sources){const row=document.createElement('tr');const details=source.error||((source.files_written||[]).join('\n'))||'-';row.innerHTML='<td><code></code></td><td></td><td><pre></pre></td>';row.querySelector('code').textContent=source.source_identity;row.children[1].textContent=source.status;row.querySelector('pre').textContent=details;tbody.appendChild(row)}}if(!terminal.has(data.status))setTimeout(refresh,2000)}catch(error){text('message',String(error));setTimeout(refresh,4000)}}refresh();
</script>
</body></html>
