<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uchat Knowledge Base</title>
<link rel="stylesheet" href="/static/account_menu.css">
<script src="/static/account_menu.js?v=20260814-2" defer></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:0;background:#f5f7fb;color:#172033;display:flex;min-height:100vh;overflow-x:hidden}
.layout{display:flex;width:100%;justify-content:center;align-items:center;min-height:100vh;}
.chat-section{flex:1;max-width:800px;width:100%;padding:20px;display:flex;flex-direction:column;height:100vh;box-sizing:border-box;}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0;}
.header-titles h1 {margin:0;font-size:24px;}
.header-titles p {margin:4px 0 0;font-size:14px;color:#64748b;}
.badge{padding:5px 10px;border-radius:99px;font-size:13px;white-space:nowrap;}
.on{background:#dcfce7;color:#166534}
.off{background:#fee2e2;color:#991b1b}

.chat-card{background:#fff;border:1px solid #dbe2ee;border-radius:14px;display:flex;flex-direction:column;flex:1;box-shadow:0 8px 30px #1f293711;overflow:hidden;margin-bottom:12px;}
.chat-history{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;background:#f8fafc;}
.chat-input-area{padding:16px;background:#fff;border-top:1px solid #e2e8f0;display:flex;flex-direction:column;gap:12px;}

.bubble{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.58;overflow-wrap:anywhere;white-space:pre-wrap;}
.bubble.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px;}
.bubble.bot{align-self:flex-start;max-width:94%;background:#fff;border:1px solid #cbd5e1;color:#1e293b;border-bottom-left-radius:4px;white-space:normal;}
.bubble.system{align-self:center;background:transparent;color:#64748b;font-size:13px;padding:4px 8px;border:none;}
.text-content{display:block;min-width:0;}
.text-content>:first-child{margin-top:0;}
.text-content>:last-child{margin-bottom:0;}
.text-content h2,.text-content h3,.text-content h4{margin:1.05em 0 .48em;color:#0f172a;line-height:1.3;}
.text-content h2{font-size:1.2em;padding-bottom:.35em;border-bottom:1px solid #e2e8f0;}
.text-content h3{font-size:1.08em;}
.text-content h4{font-size:1em;}
.text-content p{margin:.62em 0;}
.text-content ul,.text-content ol{margin:.55em 0;padding-left:1.45em;}
.text-content li{margin:.28em 0;padding-left:.12em;}
.text-content strong{font-weight:750;color:#0f172a;}
.text-content code{padding:.08em .32em;border-radius:4px;background:#eef2ff;color:#3730a3;font:0.9em ui-monospace,SFMono-Regular,Consolas,monospace;}
.text-content a{color:#1d4ed8;text-decoration:underline;text-underline-offset:2px;}
.text-content blockquote{margin:.7em 0;padding:.45em .8em;border-left:3px solid #93c5fd;background:#eff6ff;color:#334155;}
.answer-table-wrap{max-width:100%;overflow-x:auto;margin:.75em 0;border:1px solid #dbe3ef;border-radius:10px;}
.answer-table{width:100%;min-width:520px;border-collapse:collapse;background:#fff;font-size:.93em;line-height:1.48;}
.answer-table th,.answer-table td{padding:9px 11px;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top;}
.answer-table th:last-child,.answer-table td:last-child{border-right:0;}
.answer-table tr:last-child td{border-bottom:0;}
.answer-table th{background:#eff6ff;color:#1e3a8a;font-weight:750;white-space:nowrap;}
.answer-table tbody tr:nth-child(even){background:#f8fafc;}
.answer-images{display:grid;gap:10px;margin-top:10px;}
.answer-image{margin:0;}
.answer-image img{display:block;max-width:min(100%,680px);max-height:520px;width:auto;height:auto;border-radius:10px;border:1px solid #cbd5e1;background:#f8fafc;object-fit:contain;}
.answer-image figcaption{margin-top:4px;color:#64748b;font-size:12px;}

textarea{width:100%;min-height:60px;max-height:150px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box;font:inherit;resize:vertical;}
.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;}
.field label{font-size:13px;font-weight:700;color:#475569}
select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit;width:100%;}
button{padding:10px 18px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;transition:transform 0.1s;white-space:nowrap;}
button:hover{transform:translateY(-1px)}
button.secondary{background:#64748b}
button:disabled{opacity:.55;cursor:not-allowed}

.footer-links{text-align:center;font-size:14px;}
.footer-links a{color:#2563eb;text-decoration:none;margin:0 8px;}

.typing-indicator {display:flex;align-items:center;gap:4px;padding:8px 12px;}
.dot {width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;}
.dot:nth-child(1) {animation-delay:-0.32s;}
.dot:nth-child(2) {animation-delay:-0.16s;}
@keyframes bounce {0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)}}
.thinking-dots{display:inline-block;margin-left:3px;}
.thinking-dots span{display:inline-block;animation:thinkingDot 1.4s infinite ease-in-out both;font-weight:bold;}
.thinking-dots span:nth-child(1){animation-delay:0s;}
.thinking-dots span:nth-child(2){animation-delay:0.2s;}
.thinking-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes thinkingDot{0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1.2)}}
.scenario-assessment-button{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 13px;border-radius:9px;background:#0f766e;color:#fff;text-decoration:none;font-size:13px;font-weight:750;white-space:nowrap;transition:transform .1s,background .1s}.scenario-assessment-button:hover{background:#115e59;transform:translateY(-1px)}.scenario-assessment-button:focus-visible{outline:3px solid #99f6e4;outline-offset:2px}
.scenario-assessment-button[hidden]{display:none}
</style>
</head>
<body>
<div class="layout">
<div class="chat-section">
  <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="header-titles">
        <h1 data-i18n="title">Uchat Knowledge Base</h1>
        <p data-i18n="subtitle">Ask questions against the local wiki.</p>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
      <span id="health" class="badge" data-i18n="healthChecking">Checking Worker…</span>
      <div class="nav-links" id="nav-links-container" style="font-size: 13px; display: flex; align-items: center; gap: 12px; margin-top: 4px;">
        <div data-account-menu></div>
      </div>
    </div>
  </div>

  <div class="chat-card">
    <div class="chat-selectors" style="display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #cbd5e1; background: #fff; flex-shrink: 0; align-items: center; flex-wrap: wrap;">
      <div class="field" style="flex: 1; min-width: 140px; display: flex; flex-direction: row; align-items: center; gap: 8px;">
        <label for="team" data-i18n="teamLabel" style="font-size: 13px; font-weight: 700; color: #475569; white-space: nowrap;">Robot:</label>
        <select id="team" style="padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font: inherit; flex: 1; height: 36px;"></select>
      </div>
      <div class="field" style="flex: 1; min-width: 140px; display: flex; flex-direction: row; align-items: center; gap: 8px;">
        <label for="language" data-i18n="langLabel" style="font-size: 13px; font-weight: 700; color: #475569; white-space: nowrap;">Language:</label>
        <select id="language" style="padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font: inherit; flex: 1; height: 36px;">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
        </select>
      </div>
      <button id="scenarioAssessment" class="scenario-assessment-button" type="button">Assess robot fit</button>
    </div>
    <div class="chat-history" id="chatHistory">
      <!-- Chat bubbles will go here -->
    </div>
    <div class="chat-input-area" style="padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;">
      <div style="display: flex; gap: 8px; align-items: center;">
        <textarea id="question" placeholder="Enter a question" style="flex: 1; min-height: 40px; height: 40px; max-height: 80px; padding: 8px 12px; margin: 0; border-radius: 8px; box-sizing: border-box; resize: none;"></textarea>
        <button id="ask" data-i18n="askBtn" style="padding: 8px 16px; height: 40px; border-radius: 8px; margin: 0;">Ask</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="newConversation" class="secondary" type="button" data-i18n="newConvBtn" style="padding: 6px 12px; font-size: 13px; border-radius: 8px; margin: 0;">New conversation</button>
      </div>
    </div>
    <div id="grillPanel" class="chat-input-area" style="border-top:0;display:none;">
      <div id="grill-thread" style="flex:1;overflow:auto;padding:14px 4px;display:flex;flex-direction:column;gap:10px;max-height:46vh;"></div>
      <div id="grill-start-card">
        <label for="grill-intent" style="font-size:13px;font-weight:700;color:#475569;">What scenario should we evaluate?</label>
        <textarea id="grill-intent" rows="3" placeholder="Describe the robot task you want to evaluate, e.g. We want Tiangong 3 to retrieve parcels from a Full Time Locker." style="min-height:70px;"></textarea>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
          <select id="grill-model" style="flex:1;min-width:120px;"></select>
          <button id="grill-start" type="button" style="white-space:nowrap;">Start clarification</button>
        </div>
      </div>
      <div id="grill-question-card" style="display:none;">
        <div id="grill-question-text" style="font-weight:700;margin-bottom:6px;"></div>
        <div id="grill-reason" style="color:#64748b;font-size:12px;margin-bottom:8px;"></div>
        <div id="grill-options" style="display:flex;flex-direction:column;gap:6px;"></div>
        <div id="grill-custom" style="display:none;gap:6px;margin-top:8px;">
          <input id="grill-custom-answer" maxlength="5000" style="flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:8px;">
          <button id="grill-submit-custom" type="button">Submit</button>
        </div>
      </div>
      <div id="grill-actions" style="display:flex;align-items:center;gap:8px;margin-top:8px;">
        <button id="grill-analyze" class="secondary" type="button" disabled>Analyze now</button>
        <button id="grill-back" class="secondary" type="button">Back to chat</button>
        <span id="grill-status" style="font-size:12px;color:#64748b;"></span>
      </div>
    </div>
  </div>

  <!-- Links moved to the top bar -->
</div>
</div>

function appendInlineMarkdown(parent, source) {
  const pattern = /(\*\*[^*\n]+\*\*|`[^`\n]+`|\[[^\]\n]+\]\(https?:\/\/[^)\s]+\))/g;
  let cursor = 0;
  for (const match of source.matchAll(pattern)) {
    if (match.index > cursor) parent.appendChild(document.createTextNode(source.slice(cursor, match.index)));
    const token = match[0];
    if (token.startsWith('**')) {
      const strong = document.createElement('strong');
      strong.textContent = token.slice(2, -2);
      parent.appendChild(strong);
    } else if (token.startsWith('`')) {
      const code = document.createElement('code');
      code.textContent = token.slice(1, -1);
      parent.appendChild(code);
    } else {
      const parts = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/.exec(token);
      const link = document.createElement('a');
      link.textContent = parts[1];
      link.href = parts[2];
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      parent.appendChild(link);
    }
    cursor = match.index + token.length;
  }
  if (cursor < source.length) parent.appendChild(document.createTextNode(source.slice(cursor)));
}

function tableCells(line) {
  let value = line.trim();
  if (value.startsWith('|')) value = value.slice(1);
  if (value.endsWith('|')) value = value.slice(0, -1);
  return value.split('|').map(cell => cell.trim());
}

function isTableSeparator(line) {
  const cells = tableCells(line);
  return cells.length > 1 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
}

function renderAnswerText(container, source) {
  container.replaceChildren();
  const lines = String(source || '').replace(/\r\n?/g, '\n').split('\n');
  let index = 0;

  const appendParagraph = paragraphLines => {
    const paragraph = document.createElement('p');
    paragraphLines.forEach((line, lineIndex) => {
      if (lineIndex) paragraph.appendChild(document.createElement('br'));
      appendInlineMarkdown(paragraph, line.trim());
    });
    container.appendChild(paragraph);
  };

  while (index < lines.length) {
    const line = lines[index];
    const trimmed = line.trim();
    if (!trimmed) { index += 1; continue; }

    const markdownHeading = /^(#{1,4})\s+(.+)$/.exec(trimmed);
    const boldHeading = /^\*\*([^*]+)\*\*$/.exec(trimmed);
    if (markdownHeading || boldHeading) {
      const level = markdownHeading ? Math.min(4, markdownHeading[1].length + 1) : 3;
      const heading = document.createElement(`h${level}`);
      appendInlineMarkdown(heading, markdownHeading ? markdownHeading[2] : boldHeading[1]);
      container.appendChild(heading);
      index += 1;
      continue;
    }

    if (trimmed.includes('|') && index + 1 < lines.length && isTableSeparator(lines[index + 1])) {
      const headers = tableCells(trimmed);
      const wrapper = document.createElement('div');
      wrapper.className = 'answer-table-wrap';
      const table = document.createElement('table');
      table.className = 'answer-table';
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      headers.forEach(cell => {
        const th = document.createElement('th');
        appendInlineMarkdown(th, cell);
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      index += 2;
      while (index < lines.length && lines[index].trim() && lines[index].includes('|')) {
        const row = document.createElement('tr');
        const cells = tableCells(lines[index]);
        headers.forEach((_, cellIndex) => {
          const td = document.createElement('td');
          appendInlineMarkdown(td, cells[cellIndex] || '');
          row.appendChild(td);
        });
        tbody.appendChild(row);
        index += 1;
      }
      table.appendChild(tbody);
      wrapper.appendChild(table);
      container.appendChild(wrapper);
      continue;
    }

    const listMatch = /^(?:[-*+]\s+|(\d+)\.\s+)(.+)$/.exec(trimmed);
    if (listMatch) {
      const ordered = Boolean(listMatch[1]);
      const list = document.createElement(ordered ? 'ol' : 'ul');
      while (index < lines.length) {
        const item = /^(?:[-*+]\s+|(\d+)\.\s+)(.+)$/.exec(lines[index].trim());
        if (!item || Boolean(item[1]) !== ordered) break;
        const li = document.createElement('li');
        appendInlineMarkdown(li, item[2]);
        list.appendChild(li);
        index += 1;
      }
      container.appendChild(list);
      continue;
    }

    if (trimmed.startsWith('> ')) {
      const quote = document.createElement('blockquote');
      appendInlineMarkdown(quote, trimmed.slice(2));
      container.appendChild(quote);
      index += 1;
      continue;
    }

    const paragraphLines = [line];
    index += 1;
    while (index < lines.length && lines[index].trim()) {
      const next = lines[index].trim();
      if (/^(#{1,4})\s+/.test(next) || /^\*\*([^*]+)\*\*$/.test(next) ||
          /^(?:[-*+]\s+|\d+\.\s+)/.test(next) || next.startsWith('> ') ||
          (next.includes('|') && index + 1 < lines.length && isTableSeparator(lines[index + 1]))) break;
      paragraphLines.push(lines[index]);
      index += 1;
    }
    appendParagraph(paragraphLines);
  }
}

function ensureTextContainer(bubble) {
  let container = bubble.querySelector('.text-content');
  if (!container) {
    container = document.createElement('div');
    container.className = 'text-content';
    bubble.appendChild(container);
  }
  return container;
}

function renderMessageContent(bubble, role, content) {
  if (role === 'bot') renderAnswerText(ensureTextContainer(bubble), content);
  else bubble.textContent = content;
}

function loadHistory() {
  const data = localStorage.getItem(historyKey);
  if (data) {
    try {
      currentChat = JSON.parse(data);
      renderChat();
    } catch(e) {
      currentChat = [];
    }
  }
}

function renderChat() {
  chatHistory.innerHTML = '';
  currentChat.forEach(msg => {
    const d = document.createElement('div');
    d.className = 'bubble ' + msg.role;
    renderMessageContent(d, msg.role, msg.content);
    chatHistory.appendChild(d);
  });
  scrollToBottom();
}

function addMessage(role, content) {
  currentChat.push({role, content});
  saveHistory();
  const d = document.createElement('div');
  d.className = 'bubble ' + role;
  renderMessageContent(d, role, content);
  chatHistory.appendChild(d);
  scrollToBottom();
  return d;
}

function clearChat() {
  currentChat = [];
  saveHistory();
  chatHistory.innerHTML = '';
}

function scrollToBottom() {
  chatHistory.scrollTop = chatHistory.scrollHeight;
}

  document.querySelectorAll('[data-i18n]').forEach(el => {

    if (t[key]) {
      if (key === 'healthChecking' || key === 'healthOnline' || key === 'healthOffline') return;
      el.textContent = t[key];
    }
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    if (t[key]) {
      el.setAttribute('title', t[key]);
    }
  });
  question.placeholder = t.placeholder;
  scenarioAssessment.textContent=scenarioButtonI18n[currentLang]||scenarioButtonI18n.en;
  updateHealthStatus();
}

async function submitQuestion(){
  if(askButton.disabled)return;
  const q=question.value.trim();
  if(!q)return;
  const priorConversation=currentChat
    .filter(message=>message&&['user','bot'].includes(message.role)&&typeof message.content==='string')
    .slice(-12)
    .map(message=>({role:message.role,content:message.content}));

  askButton.disabled=true;
  newConversationButton.disabled=true;
  question.value='';

  addMessage('user', q);

  const loadingBubble = document.createElement('div');
  loadingBubble.className = 'bubble bot typing-indicator';
  loadingBubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatHistory.appendChild(loadingBubble);
  scrollToBottom();

  let thinkingDiv = null;

  try{
    const r=await fetch('/ask',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        question:q,
        language:language.value,
        team:team.value,
        conversation_id:getConversationId(),
        history:priorConversation
      })
    });

    if(!r.ok) {
      const d=await r.json();
      if(loadingBubble && loadingBubble.parentNode) {
        loadingBubble.remove();
      }
      addMessage('bot', d.error || 'Request failed');
      return;
    }

    if(loadingBubble && loadingBubble.parentNode) {
      loadingBubble.remove();
    }

    const botBubble = addMessage('bot', '');
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let done = false;
    let buffer = "";
    let accumulatedText = "";

    while(!done) {
      const { value, done: readerDone } = await reader.read();
      done = readerDone;
      if (value) {
        buffer += decoder.decode(value, { stream: !done });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const event = JSON.parse(line);

            if (event.status === "metadata") {
              if(event.conversation_id) {
                localStorage.setItem(conversationKey, event.conversation_id);
              }
              continue;
            }

            if (event.status === "error") {
              renderAnswerText(ensureTextContainer(botBubble), event.error);
              accumulatedText = event.error;
              break;
            }

            if (event.status === "done") {
              renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
              scrollToBottom();
              continue;
            }

            if (event.thinking) {
              if (!thinkingDiv) {
                thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'thinking-block';
                thinkingDiv.style.fontStyle = 'italic';
                thinkingDiv.style.opacity = '0.7';
                thinkingDiv.style.marginBottom = '8px';
                thinkingDiv.style.padding = '8px';
                thinkingDiv.style.borderLeft = '3px solid var(--accent-light, #3b82f6)';
                thinkingDiv.style.backgroundColor = 'rgba(0,0,0,0.03)';
                thinkingDiv.style.borderRadius = '0 4px 4px 0';
                thinkingDiv.dataset.raw = '';
                botBubble.insertBefore(thinkingDiv, botBubble.firstChild);
              }
              thinkingDiv.dataset.raw = (thinkingDiv.dataset.raw || '') + event.thinking;
              thinkingDiv.textContent = thinkingDiv.dataset.raw;
              thinkingDiv.style.display = thinkingDiv.dataset.raw.trim() ? 'block' : 'none';
            }

            if (event.thinking_tokens && !event.thinking && !event.text && !thinkingDiv?.dataset.raw) {
              if (!thinkingDiv) {
                thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'thinking-block';
                thinkingDiv.style.fontStyle = 'italic';
                thinkingDiv.style.opacity = '0.7';
                thinkingDiv.style.marginBottom = '8px';
                thinkingDiv.style.padding = '8px';
                thinkingDiv.style.borderLeft = '3px solid var(--accent-light, #3b82f6)';
                thinkingDiv.style.backgroundColor = 'rgba(0,0,0,0.03)';
                thinkingDiv.style.borderRadius = '0 4px 4px 0';
                botBubble.insertBefore(thinkingDiv, botBubble.firstChild);
              }
              const isZh = (typeof language !== 'undefined' && language.value === 'zh-CN') || (typeof uiLanguage !== 'undefined' && uiLanguage.value === 'zh-CN');
              const labelText = isZh ? '思考中' : 'Thinking';
              thinkingDiv.innerHTML = `${labelText} <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>`;
            }

            if (typeof event.replace_text === 'string') {
              accumulatedText = event.replace_text;
              renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
            }

            if (event.image && typeof event.image.data === 'string') {
              const allowedTypes = new Set(['image/png','image/jpeg','image/gif','image/webp']);
              if (allowedTypes.has(event.image.mime_type)) {
                let gallery = botBubble.querySelector('.answer-images');
                if (!gallery) {
                  gallery = document.createElement('div');
                  gallery.className = 'answer-images';
                  botBubble.appendChild(gallery);
                }
                const figure = document.createElement('figure');
                figure.className = 'answer-image';
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.decoding = 'async';
                img.alt = String(event.image.alt || 'Knowledge-base image');
                img.src = `data:${event.image.mime_type};base64,${event.image.data}`;
                figure.appendChild(img);
                if (event.image.alt) {
                  const caption = document.createElement('figcaption');
                  caption.textContent = String(event.image.alt);
                  figure.appendChild(caption);
                }
                gallery.appendChild(figure);
              }
            }

            if (event.text) {
              accumulatedText += event.text;
              renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
            }
            scrollToBottom();
          } catch(e) {
            console.error("Failed to parse JSON line", line, e);
          }
        }
      }
    }

    if (currentChat.length > 0 && currentChat[currentChat.length - 1].role === 'bot') {
      currentChat[currentChat.length - 1].content = accumulatedText || 'No response';
      saveHistory();
    }
  }catch(e){
    if(loadingBubble && loadingBubble.parentNode) {
      loadingBubble.remove();
    }
    const t = i18n[currentLang] || i18n['en'];
    addMessage('bot', t.genericError || 'An error occurred. Please try again.');
  }finally{
    if (thinkingDiv) {
      thinkingDiv.style.display = 'none';
    }
    askButton.disabled=false;
    newConversationButton.disabled=false;
  }
}

  intent: document.getElementById('grill-intent'),

  analyze: document.getElementById('grill-analyze'),
  back: document.getElementById('grill-back'),
  status: document.getElementById('grill-status'),
};
const grillStorageKey = 'agent1.grill.session';
let grill = null;
let grillResumeToken = '';

function grillRobotOptions(){
  const auto = document.createElement('option');
  auto.value = 'auto';
  auto.textContent = 'Auto-select from scenario';
  grillEls.model.replaceChildren(auto);
  robots.forEach(robot=>{
    const op = document.createElement('option');
    op.value = robot.name;
    op.textContent = robotLabel(robot);
    grillEls.model.appendChild(op);
  });
  const saved = localStorage.getItem('agent1_team');
  grillEls.model.value = saved && saved !== 'all' ? saved : 'auto';
}

function grillBubble(text, kind){
  const b = document.createElement('div');
  b.className = 'bubble ' + kind;
  b.textContent = text;
  grillEls.thread.appendChild(b);
  grillEls.thread.scrollTop = grillEls.thread.scrollHeight;
}

function grillStatus(text){
  grillEls.status.textContent = text || '';
}

function saveGrillSession(){
  if (grill) localStorage.setItem(grillStorageKey, JSON.stringify({session_id:grill.session_id, resume_token:grillResumeToken}));
}

function clearGrillSession(){
  localStorage.removeItem(grillStorageKey);
  grill = null;
  grillResumeToken = '';
}

function appendToChatHistory(role, content){
  currentChat.push({role, content});
  saveHistory();
}

function enterGrillMode(){
  const chatInput = document.querySelector('.chat-input-area');
  if (chatInput) chatInput.style.display = 'none';
  grillEls.panel.style.display = 'block';
  grillEls.thread.replaceChildren();
  const prefill = question.value.trim();
  if (prefill) grillEls.intent.value = prefill;
  loadGrillSession();
}

function backToChat(){
  grillEls.panel.style.display = 'none';
  const chatInput = document.querySelector('.chat-input-area');
  if (chatInput) chatInput.style.display = '';
  question.focus();
}

async function loadGrillSession(){
  const item = JSON.parse(localStorage.getItem(grillStorageKey) || 'null');
  if (!item || !item.session_id) { renderGrillStart(); return; }
  grillResumeToken = item.resume_token || '';
  try {
    const r = await fetch(`/api/scenario-sessions/${encodeURIComponent(item.session_id)}`, {
      headers: grillHeaders(false),
    });
    const d = await r.json();
    if (r.ok && d.session) {
      grill = d.session;
      renderGrill();
    } else {
      localStorage.removeItem(grillStorageKey);
      renderGrillStart();
    }
  } catch {
    renderGrillStart();
  }
}

function grillHeaders(json){
  const h = {};
  if (json) h['Content-Type'] = 'application/json';
  if (grillResumeToken) h['X-Scenario-Resume-Token'] = grillResumeToken;
  return h;
}

function renderGrillStart(){
  grillEls.startCard.style.display = 'block';
  grillEls.questionCard.style.display = 'none';
  grillEls.analyze.disabled = true;
  grillEls.status.textContent = '';
  grillEls.thread.replaceChildren();
  grillBubble('Describe the robot task you want to evaluate. I will ask one high-impact question at a time.', 'bot');
}

function renderGrill(){
  if (!grill) return;
  const state = grill.current_state || {};
  grillEls.startCard.style.display = 'none';
  grillEls.thread.replaceChildren();
  grillBubble(state.initial_intent || '', 'user');
  (state.question_history || []).forEach(item=>{
    grillBubble(item.question || '', 'bot');
    grillBubble(item.answer_mode === 'unknown' ? "I don't know yet" : (item.answer || ''), 'user');
  });
  const q = state.current_question;
  if (q) {
    grillEls.questionCard.style.display = 'block';
    grillEls.questionText.textContent = q.question;
    grillEls.reason.textContent = q.reason_for_asking || '';
    grillEls.options.replaceChildren();
    (q.options || []).slice(0,3).forEach((text, index)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = `${index+1}. ${text}`;
      b.addEventListener('click', ()=>grillAnswer('option', text));
      grillEls.options.appendChild(b);
    });
    const other = document.createElement('button');
    other.type = 'button';
    other.textContent = `4. Other`;
    other.addEventListener('click', ()=>{ grillEls.custom.style.display = 'flex'; grillEls.customAnswer.focus(); });
    grillEls.options.appendChild(other);
    grillEls.custom.style.display = 'none';
    grillEls.customAnswer.value = '';
  } else {
    grillEls.questionCard.style.display = 'none';
  }
  const gate = state.minimum_gate || {};
  grillEls.analyze.disabled = !(state.status === 'report_ready' ? false : (gate.passed && state.status !== 'analyzing'));
  grillStatus(state.status === 'analyzing' ? 'Analysis in progress...' : (state.status === 'report_ready' ? 'Report ready.' : ''));
  if (state.status === 'report_ready' && grill.current_report_revision_id) {
    const report = (grill.reports || []).find(r=>r.report_revision_id === grill.current_report_revision_id);
    if (report) renderGrillReport(report);
  }
  saveGrillSession();
}

async function grillStart(){
  const intent = grillEls.intent.value.trim();
  if (intent.length < 3) { grillStatus('Describe the scenario first.'); return; }
  grillEls.start.disabled = true;
  grillStatus('Creating scenario...');
  try {
    const r = await fetch('/api/scenario-sessions', {
      method: 'POST',
      headers: grillHeaders(true),
      body: JSON.stringify({
        initial_intent: intent,
        model_id: grillEls.model.value,
        language: language.value,
        conversation_id: getConversationId(),
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not create scenario');
    grill = d.session;
    grillResumeToken = d.resume_token || '';
    renderGrill();
  } catch (e) {
    grillStatus(e.message);
  } finally {
    grillEls.start.disabled = false;
  }
}

async function grillAnswer(mode, text){
  const state = grill && grill.current_state;
  const q = state && state.current_question;
  if (!q) return;
  grillStatus('Preparing the next question...');
  try {
    const r = await fetch(`/api/scenario-sessions/${encodeURIComponent(grill.session_id)}/answers`, {
      method: 'POST',
      headers: grillHeaders(true),
      body: JSON.stringify({
        expected_state_version: state.state_version,
        question_id: q.question_id,
        answer_mode: mode,
        answer: text,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Answer was not saved');
    grill = d.session;
    appendToChatHistory('user', text);
    renderGrill();
    pollGrillIfAnalyzing();
  } catch (e) {
    grillStatus(e.message);
  }
}

async function grillAnalyze(){
  if (!grill) return;
  const state = grill.current_state || {};
  grillEls.analyze.disabled = true;
  grillStatus('Queuing analysis...');
  try {
    const r = await fetch(`/api/scenario-sessions/${encodeURIComponent(grill.session_id)}/analyze-now`, {
      method: 'POST',
      headers: grillHeaders(true),
      body: JSON.stringify({ expected_state_version: state.state_version, trigger: 'user_requested_early' }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Analysis could not be queued');
    grill = d.session;
    renderGrill();
    pollGrillIfAnalyzing();
  } catch (e) {
    grillStatus(e.message);
    grillEls.analyze.disabled = !(state.minimum_gate && state.minimum_gate.passed);
  }
}

let grillPollTimer = null;
async function pollGrillIfAnalyzing(){
  if (!grill || (grill.current_state || {}).status !== 'analyzing') return;
  clearInterval(grillPollTimer);
  grillPollTimer = setInterval(async ()=>{
    if (!grill) { clearInterval(grillPollTimer); return; }
    try {
      const r = await fetch(`/api/scenario-sessions/${encodeURIComponent(grill.session_id)}`, { headers: grillHeaders(false) });
      const d = await r.json();
      if (!r.ok || !d.session) { clearInterval(grillPollTimer); return; }
      grill = d.session;
      const status = (grill.current_state || {}).status;
      if (status === 'report_ready') {
        clearInterval(grillPollTimer);
        const report = (grill.reports || []).find(item=>item.report_revision_id === grill.current_report_revision_id);
        if (report) renderGrillReport(report);
      }
      renderGrill();
      if (status !== 'analyzing') clearInterval(grillPollTimer);
    } catch { clearInterval(grillPollTimer); }
  }, 1800);
}

function renderGrillReport(revision){
  const report = revision.report || {};
  const lines = [];
  lines.push(report.conclusion ? String(report.conclusion).replaceAll('_',' ') : 'Feasibility report');
  if (report.executive_summary) lines.push('', report.executive_summary);
  const section = (title, items, fmt) => {
    if (!items || !items.length) return;
    lines.push('', title);
    items.forEach(item=>lines.push('- ' + (fmt ? fmt(item) : String(item))));
  };
  section('Conditions', report.conditions, null);
  section('Main evidence', report.main_evidence, x=>`${x.name || ''} — ${x.support_state || ''}`);
  section('Engineering effort', (report.engineering_effort || {}).workstreams || [], null);
  section('Tools and SDK support', report.tool_support, x=>`${x.name || x.tool || ''}: ${x.how_it_helps || x.support || ''}`);
  section('PoC and acceptance', report.acceptance_tests || [], null);
  section('Next actions', report.next_actions, x=>`${x.owner || ''}: ${x.action || ''}`);
  const text = lines.join('\n');
  grillBubble(text, 'bot');
  appendToChatHistory('bot', text);
}

function setupGrillMode(){
  grillRobotOptions();
  grillEls.start.addEventListener('click', grillStart);
  grillEls.submitCustom.addEventListener('click', ()=>grillAnswer('custom', grillEls.customAnswer.value));
  grillEls.analyze.addEventListener('click', grillAnalyze);
  grillEls.back.addEventListener('click', backToChat);
  scenarioAssessment.addEventListener('click', enterGrillMode);
}

// Init
translateUI();
loadHistory();
setupGrillMode();

</script>
