<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uchat Knowledge Base</title>
<link rel="stylesheet" href="/petdex/styles.css">
<link rel="stylesheet" href="/static/account_menu.css">
<script src="/static/account_menu.js" defer></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:0;background:#f5f7fb;color:#172033;display:flex;min-height:100vh;overflow-x:hidden}
.layout{display:flex;width:100%;justify-content:center;align-items:center;min-height:100vh;}
.chat-section{flex:1;max-width:800px;width:100%;padding:20px;display:flex;flex-direction:column;height:100vh;box-sizing:border-box;}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0;}
.header-titles h1 {margin:0;font-size:24px;}
.header-titles p {margin:4px 0 0;font-size:14px;color:#64748b;}
.badge{padding:5px 10px;border-radius:99px;font-size:13px;white-space:nowrap;}
.on{background:#dcfce7;color:#166534}
.off{background:#fee2e2;color:#991b1b}

.chat-card{background:#fff;border:1px solid #dbe2ee;border-radius:14px;display:flex;flex-direction:column;flex:1;box-shadow:0 8px 30px #1f293711;overflow:hidden;margin-bottom:12px;}
.chat-history{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;background:#f8fafc;}
.chat-input-area{padding:16px;background:#fff;border-top:1px solid #e2e8f0;display:flex;flex-direction:column;gap:12px;}

.bubble{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap;}
.bubble.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px;}
.bubble.bot{align-self:flex-start;background:#fff;border:1px solid #cbd5e1;color:#1e293b;border-bottom-left-radius:4px;}
.bubble.system{align-self:center;background:transparent;color:#64748b;font-size:13px;padding:4px 8px;border:none;}

textarea{width:100%;min-height:60px;max-height:150px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box;font:inherit;resize:vertical;}
.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;}
.field label{font-size:13px;font-weight:700;color:#475569}
select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit;width:100%;}
button{padding:10px 18px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;transition:transform 0.1s;white-space:nowrap;}
button:hover{transform:translateY(-1px)}
button.secondary{background:#64748b}
button:disabled{opacity:.55;cursor:not-allowed}

.footer-links{text-align:center;font-size:14px;}
.footer-links a{color:#2563eb;text-decoration:none;margin:0 8px;}

.typing-indicator {display:flex;align-items:center;gap:4px;padding:8px 12px;}
.dot {width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;}
.dot:nth-child(1) {animation-delay:-0.32s;}
.dot:nth-child(2) {animation-delay:-0.16s;}
@keyframes bounce {0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)}}
.thinking-dots{display:inline-block;margin-left:3px;}
.thinking-dots span{display:inline-block;animation:thinkingDot 1.4s infinite ease-in-out both;font-weight:bold;}
.thinking-dots span:nth-child(1){animation-delay:0s;}
.thinking-dots span:nth-child(2){animation-delay:0.2s;}
.thinking-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes thinkingDot{0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<div class="layout">
<div class="chat-section">
  <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div id="coding-companion" class="petdex-companion" data-mode="sleeping" style="--petdex-scale: 2;"></div>
      <div class="header-titles">
        <h1 data-i18n="title">Uchat Knowledge Base</h1>
        <p data-i18n="subtitle">Ask questions against the local wiki.</p>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
      <span id="health" class="badge" data-i18n="healthChecking">Checking Worker…</span>
      <div class="nav-links" id="nav-links-container" style="font-size: 13px; display: flex; align-items: center; gap: 12px; margin-top: 4px;">
        <a href="/wecom-ask" data-i18n="wecomLink" style="color: #2563eb; text-decoration: none; font-weight: 500;">WeCom Version</a>
        <div data-account-menu></div>
      </div>
    </div>
  </div>

  <div class="chat-card">
    <div class="chat-selectors" style="display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #cbd5e1; background: #fff; flex-shrink: 0; align-items: center; flex-wrap: wrap;">
      <div class="field" style="flex: 1; min-width: 140px; display: flex; flex-direction: row; align-items: center; gap: 8px;">
        <label for="team" data-i18n="teamLabel" style="font-size: 13px; font-weight: 700; color: #475569; white-space: nowrap;">Robot:</label>
        <select id="team" style="padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font: inherit; flex: 1; height: 36px;"></select>
      </div>
      <div class="field" style="flex: 1; min-width: 140px; display: flex; flex-direction: row; align-items: center; gap: 8px;">
        <label for="language" data-i18n="langLabel" style="font-size: 13px; font-weight: 700; color: #475569; white-space: nowrap;">Language:</label>
        <select id="language" style="padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font: inherit; flex: 1; height: 36px;">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
        </select>
      </div>
    </div>
    <div class="chat-history" id="chatHistory">
      <!-- Chat bubbles will go here -->
    </div>
    <div class="chat-input-area" style="padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;">
      <div style="display: flex; gap: 8px; align-items: center;">
        <textarea id="question" placeholder="Enter a question" style="flex: 1; min-height: 40px; height: 40px; max-height: 80px; padding: 8px 12px; margin: 0; border-radius: 8px; box-sizing: border-box; resize: none;"></textarea>
        <button id="ask" data-i18n="askBtn" style="padding: 8px 16px; height: 40px; border-radius: 8px; margin: 0;">Ask</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="newConversation" class="secondary" type="button" data-i18n="newConvBtn" style="padding: 6px 12px; font-size: 13px; border-radius: 8px; margin: 0;">New conversation</button>
      </div>
    </div>
  </div>

  <!-- Links moved to the top bar -->
</div>
</div>

const health=document.getElementById('health');
const askButton=document.getElementById('ask');
const newConversationButton=document.getElementById('newConversation');
const question=document.getElementById('question');
const chatHistory=document.getElementById('chatHistory');
const language=document.getElementById('language');
const team=document.getElementById('team');

const conversationKey='agent1_conversation_id';
const languageKey='agent1_answer_language';
const teamKey='agent1_team';
const historyKey='agent1_chat_history';

let currentLang = 'zh-CN';

const companionEl = document.getElementById('coding-companion');
function setCompanionMode(mode) {
  if (companionEl) {
    companionEl.dataset.mode = mode;
    companionEl.setAttribute('aria-label', `Robot companion: ${mode}`);
  }
}

question.addEventListener('input', () => {
  if (question.value.trim() && companionEl.dataset.mode === 'sleeping') {
    setCompanionMode('thinking');
  } else if (!question.value.trim() && companionEl.dataset.mode === 'thinking') {
    setCompanionMode('sleeping');
  }
});
question.addEventListener('focus', () => {
  if (companionEl.dataset.mode === 'sleeping') {
    setCompanionMode('thinking');
  }
});
question.addEventListener('blur', () => {
  if (!question.value.trim() && companionEl.dataset.mode === 'thinking') {
    setCompanionMode('sleeping');
  }
});
let workerOnline = false;
let currentChat = [];

function saveHistory() {
  localStorage.setItem(historyKey, JSON.stringify(currentChat));
}

function loadHistory() {
  const data = localStorage.getItem(historyKey);
  if (data) {
    try {
      currentChat = JSON.parse(data);
      renderChat();
    } catch(e) {
      currentChat = [];
    }
  }
}

function renderChat() {
  chatHistory.innerHTML = '';
  currentChat.forEach(msg => {
    const d = document.createElement('div');
    d.className = 'bubble ' + msg.role;
    d.textContent = msg.content;
    chatHistory.appendChild(d);
  });
  scrollToBottom();
}

function addMessage(role, content) {
  currentChat.push({role, content});
  saveHistory();
  const d = document.createElement('div');
  d.className = 'bubble ' + role;
  d.textContent = content;
  chatHistory.appendChild(d);
  scrollToBottom();
  return d;
}

function clearChat() {
  currentChat = [];
  saveHistory();
  chatHistory.innerHTML = '';
}

function scrollToBottom() {
  chatHistory.scrollTop = chatHistory.scrollHeight;
}

function translateUI() {
  const t = i18n[currentLang] || i18n['en'];
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) {
      if (key === 'healthChecking' || key === 'healthOnline' || key === 'healthOffline') return;
      el.textContent = t[key];
    }
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    if (t[key]) {
      el.setAttribute('title', t[key]);
    }
  });
  question.placeholder = t.placeholder;
  updateHealthStatus();
}

const allowedTeams=__ALLOWED_TEAMS__;
const allOp = document.createElement('option');
allOp.value = 'all';
allOp.setAttribute('data-i18n', 'allRobots');
team.appendChild(allOp);
allowedTeams.forEach(t=>{const op=document.createElement('option');op.value=t;op.textContent=t;team.appendChild(op)});

function newConversationId(){return 'web:'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));}
function getConversationId(){let id=localStorage.getItem(conversationKey);if(!id){id=newConversationId();localStorage.setItem(conversationKey,id)}return id;}

language.value=localStorage.getItem(languageKey)||'zh-CN';
currentLang = language.value;

language.addEventListener('change',()=>{
  currentLang = language.value;
  localStorage.setItem(languageKey,currentLang);
  translateUI();
});

if(localStorage.getItem(teamKey) && (allowedTeams.includes(localStorage.getItem(teamKey)) || localStorage.getItem(teamKey) === 'all')){
  team.value=localStorage.getItem(teamKey);
}else {
  team.value='all';
}
team.addEventListener('change',()=>localStorage.setItem(teamKey,team.value));

function updateHealthStatus() {
  const t = i18n[currentLang] || i18n['en'];
  health.textContent = workerOnline ? t.healthOnline : t.healthOffline;
  health.className = 'badge ' + (workerOnline ? 'on' : 'off');
}

async function checkHealth(){
  try{
    const r=await fetch('/health');
    const d=await r.json();
    workerOnline = !!d.worker_online;
  }catch{
    workerOnline = false;
  }
  updateHealthStatus();
}
checkHealth();setInterval(checkHealth,5000);

async function submitQuestion(){
  if(askButton.disabled)return;
  const q=question.value.trim();
  if(!q)return;

  setCompanionMode('charging');
  askButton.disabled=true;
  newConversationButton.disabled=true;
  question.value='';

  addMessage('user', q);

  const loadingBubble = document.createElement('div');
  loadingBubble.className = 'bubble bot typing-indicator';
  loadingBubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatHistory.appendChild(loadingBubble);
  scrollToBottom();

  let thinkingDiv = null;

  try{
    const r=await fetch('/ask',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        question:q,
        language:language.value,
        team:team.value,
        conversation_id:getConversationId()
      })
    });

    if(!r.ok) {
      const d=await r.json();
      if(loadingBubble && loadingBubble.parentNode) {
        loadingBubble.remove();
      }
      addMessage('bot', d.error || 'Request failed');
      return;
    }

    if(loadingBubble && loadingBubble.parentNode) {
      loadingBubble.remove();
    }

    const botBubble = addMessage('bot', '');
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let done = false;
    let buffer = "";
    let accumulatedText = "";

    while(!done) {
      const { value, done: readerDone } = await reader.read();
      done = readerDone;
      if (value) {
        buffer += decoder.decode(value, { stream: !done });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const event = JSON.parse(line);

            if (event.status === "metadata") {
              if(event.conversation_id) {
                localStorage.setItem(conversationKey, event.conversation_id);
              }
              continue;
            }

            if (event.status === "error") {
              botBubble.textContent = event.error;
              accumulatedText = event.error;
              break;
            }

            if (event.thinking) {
              setCompanionMode('thinking');
              if (!thinkingDiv) {
                thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'thinking-block';
                thinkingDiv.style.fontStyle = 'italic';
                thinkingDiv.style.opacity = '0.7';
                thinkingDiv.style.marginBottom = '8px';
                thinkingDiv.style.padding = '8px';
                thinkingDiv.style.borderLeft = '3px solid var(--accent-light, #3b82f6)';
                thinkingDiv.style.backgroundColor = 'rgba(0,0,0,0.03)';
                thinkingDiv.style.borderRadius = '0 4px 4px 0';
                thinkingDiv.dataset.raw = '';
                botBubble.insertBefore(thinkingDiv, botBubble.firstChild);
              }
              thinkingDiv.dataset.raw = (thinkingDiv.dataset.raw || '') + event.thinking;
              let text = thinkingDiv.dataset.raw;
              text = text.replace(/claude\.md/gi, (match) => {
                return /[\u4e00-\u9fa5]/.test(text) ? '系统指南' : 'system guidelines';
              });
              text = text.replace(/\b(read|reading|check|checking|inspect|inspecting)\s+CLAUDE\b/gi, '$1 guidelines');
              text = text.replace(/\b(读取|查看|检查)\s*CLAUDE\b/gi, '$1系统指南');

              thinkingDiv.textContent = text;
              thinkingDiv.style.display = text.trim() ? 'block' : 'none';
            }

            if (event.thinking_tokens && !event.thinking && !event.text && !thinkingDiv?.dataset.raw) {
              setCompanionMode('thinking');
              if (!thinkingDiv) {
                thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'thinking-block';
                thinkingDiv.style.fontStyle = 'italic';
                thinkingDiv.style.opacity = '0.7';
                thinkingDiv.style.marginBottom = '8px';
                thinkingDiv.style.padding = '8px';
                thinkingDiv.style.borderLeft = '3px solid var(--accent-light, #3b82f6)';
                thinkingDiv.style.backgroundColor = 'rgba(0,0,0,0.03)';
                thinkingDiv.style.borderRadius = '0 4px 4px 0';
                botBubble.insertBefore(thinkingDiv, botBubble.firstChild);
              }
              const isZh = (typeof language !== 'undefined' && language.value === 'zh-CN') || (typeof uiLanguage !== 'undefined' && uiLanguage.value === 'zh-CN');
              const labelText = isZh ? '思考中' : 'Thinking';
              thinkingDiv.innerHTML = `${labelText} <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>`;
            }

            if (event.text) {
              setCompanionMode('charging');
              let textContainer = botBubble.querySelector('.text-content');
              if (!textContainer) {
                textContainer = document.createElement('span');
                textContainer.className = 'text-content';
                botBubble.appendChild(textContainer);
              }
              textContainer.textContent += event.text;
              accumulatedText += event.text;
            }
            scrollToBottom();
          } catch(e) {
            console.error("Failed to parse JSON line", line, e);
          }
        }
      }
    }

    if (currentChat.length > 0 && currentChat[currentChat.length - 1].role === 'bot') {
      currentChat[currentChat.length - 1].content = accumulatedText || 'No response';
      saveHistory();
    }
  }catch(e){
    if(loadingBubble && loadingBubble.parentNode) {
      loadingBubble.remove();
    }
    const t = i18n[currentLang] || i18n['en'];
    addMessage('bot', t.genericError || 'An error occurred. Please try again.');
  }finally{
    if (thinkingDiv) {
      thinkingDiv.style.display = 'none';
    }
    askButton.disabled=false;
    newConversationButton.disabled=false;
    setCompanionMode('sleeping');
  }
}
askButton.onclick=submitQuestion;
question.addEventListener('keydown',event=>{if(event.ctrlKey&&event.key==='Enter') {event.preventDefault();submitQuestion();}});
newConversationButton.onclick=()=>{
  localStorage.setItem(conversationKey,newConversationId());
  clearChat();
  const t = i18n[currentLang] || i18n['en'];
  addMessage('system', t.newConvStarted);
  question.focus()
};

// Init
translateUI();
loadHistory();

</script>
</body></html>
