let currentChat = [];
let shownImageFingerprints = new Set();
let transientImageKeys = new Set();
function loadShownImageFingerprints() {
  if (historyAccount) {
    shownImageFingerprints = new Set(currentChat.flatMap(message => message.images || [])
      .map(image => image.fingerprint).filter(value => typeof value === 'string' && /^[a-f0-9]{64}$/i.test(value)));
    transientImageKeys = new Set();
    return;
  }
  const conversationId = getConversationId();
  try {
    const byConversation = JSON.parse(localStorage.getItem(imageHistoryKey) || '{}');
    const values = Array.isArray(byConversation?.[conversationId]) ? byConversation[conversationId] : [];
    shownImageFingerprints = new Set(values.filter(value=>typeof value === 'string' && /^[a-f0-9]{64}$/i.test(value)));
  } catch {
    shownImageFingerprints = new Set();
  }
  transientImageKeys = new Set();
}

function saveShownImageFingerprints() {
  if (historyAccount) return;
  const conversationId = getConversationId();
  let byConversation = {};
  try {
    const parsed = JSON.parse(localStorage.getItem(imageHistoryKey) || '{}');
    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) byConversation = parsed;
  } catch {}
  delete byConversation[conversationId];
  byConversation[conversationId] = [...shownImageFingerprints].slice(-100);
  const recent = Object.entries(byConversation).slice(-20);
  localStorage.setItem(imageHistoryKey, JSON.stringify(Object.fromEntries(recent)));
}

function shouldShowConversationImage(image) {
  const fingerprint = typeof image.fingerprint === 'string' && /^[a-f0-9]{64}$/i.test(image.fingerprint)
    ? image.fingerprint.toLowerCase() : '';
  if (fingerprint) {
    if (shownImageFingerprints.has(fingerprint)) return false;
    shownImageFingerprints.add(fingerprint);
    saveShownImageFingerprints();
    return true;
  }
  // Compatibility for a Worker that has not yet been upgraded: retain this
  // fallback only in memory, so raw image data is never put into localStorage.
  const transientKey = `${image.mime_type}:${image.data}`;
  if (transientImageKeys.has(transientKey)) return false;
  transientImageKeys.add(transientKey);
  return true;
}

function appendInlineMarkdown(parent, source) {
  const pattern = /(\*\*[^*\n]+\*\*|`[^`\n]+`|\[[^\]\n]+\]\(https?:\/\/[^)\s]+\))/g;
  let cursor = 0;
  for (const match of source.matchAll(pattern)) {
    if (match.index > cursor) parent.appendChild(document.createTextNode(source.slice(cursor, match.index)));
    const token = match[0];
    if (token.startsWith('**')) {
      const strong = document.createElement('strong');
      strong.textContent = token.slice(2, -2);
      parent.appendChild(strong);
    } else if (token.startsWith('`')) {
      const code = document.createElement('code');
      code.textContent = token.slice(1, -1);
      parent.appendChild(code);
    } else {
      const parts = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/.exec(token);
      const link = document.createElement('a');
      link.textContent = parts[1];
      link.href = parts[2];
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      parent.appendChild(link);
    }
    cursor = match.index + token.length;
  }
  if (cursor < source.length) parent.appendChild(document.createTextNode(source.slice(cursor)));
}

function tableCells(line) {
  let value = line.trim();
  if (value.startsWith('|')) value = value.slice(1);
  if (value.endsWith('|')) value = value.slice(0, -1);
  return value.split('|').map(cell => cell.trim());
}

function isTableSeparator(line) {
  const cells = tableCells(line);
  return cells.length > 1 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
}

function renderAnswerText(container, source) {
  container.replaceChildren();
  const lines = String(source || '').replace(/\r\n?/g, '\n').split('\n');
  let index = 0;

  const appendParagraph = paragraphLines => {
    const paragraph = document.createElement('p');
    paragraphLines.forEach((line, lineIndex) => {
      if (lineIndex) paragraph.appendChild(document.createElement('br'));
      appendInlineMarkdown(paragraph, line.trim());
    });
    container.appendChild(paragraph);
  };

  while (index < lines.length) {
    const line = lines[index];
    const trimmed = line.trim();
    if (!trimmed) { index += 1; continue; }

    const markdownHeading = /^(#{1,4})\s+(.+)$/.exec(trimmed);
    const boldHeading = /^\*\*([^*]+)\*\*$/.exec(trimmed);
    if (markdownHeading || boldHeading) {
      const level = markdownHeading ? Math.min(4, markdownHeading[1].length + 1) : 3;
      const heading = document.createElement(`h${level}`);
      appendInlineMarkdown(heading, markdownHeading ? markdownHeading[2] : boldHeading[1]);
      container.appendChild(heading);
      index += 1;
      continue;
    }

    if (trimmed.includes('|') && index + 1 < lines.length && isTableSeparator(lines[index + 1])) {
      const headers = tableCells(trimmed);
      const wrapper = document.createElement('div');
      wrapper.className = 'answer-table-wrap';
      const table = document.createElement('table');
      table.className = 'answer-table';
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      headers.forEach(cell => {
        const th = document.createElement('th');
        appendInlineMarkdown(th, cell);
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      index += 2;
      while (index < lines.length && lines[index].trim() && lines[index].includes('|')) {
        const row = document.createElement('tr');
        const cells = tableCells(lines[index]);
        headers.forEach((_, cellIndex) => {
          const td = document.createElement('td');
          appendInlineMarkdown(td, cells[cellIndex] || '');
          row.appendChild(td);
        });
        tbody.appendChild(row);
        index += 1;
      }
      table.appendChild(tbody);
      wrapper.appendChild(table);
      container.appendChild(wrapper);
      continue;
    }

    const listMatch = /^(?:[-*+]\s+|(\d+)\.\s+)(.+)$/.exec(trimmed);
    if (listMatch) {
      const ordered = Boolean(listMatch[1]);
      const list = document.createElement(ordered ? 'ol' : 'ul');
      while (index < lines.length) {
        const item = /^(?:[-*+]\s+|(\d+)\.\s+)(.+)$/.exec(lines[index].trim());
        if (!item || Boolean(item[1]) !== ordered) break;
        const li = document.createElement('li');
        appendInlineMarkdown(li, item[2]);
        list.appendChild(li);
        index += 1;
      }
      container.appendChild(list);
      continue;
    }

    if (trimmed.startsWith('> ')) {
      const quote = document.createElement('blockquote');
      appendInlineMarkdown(quote, trimmed.slice(2));
      container.appendChild(quote);
      index += 1;
      continue;
    }

    const paragraphLines = [line];
    index += 1;
    while (index < lines.length && lines[index].trim()) {
      const next = lines[index].trim();
      if (/^(#{1,4})\s+/.test(next) || /^\*\*([^*]+)\*\*$/.test(next) ||
          /^(?:[-*+]\s+|\d+\.\s+)/.test(next) || next.startsWith('> ') ||
          (next.includes('|') && index + 1 < lines.length && isTableSeparator(lines[index + 1]))) break;
      paragraphLines.push(lines[index]);
      index += 1;
    }
    appendParagraph(paragraphLines);
  }
}

function ensureTextContainer(bubble) {
  let container = bubble.querySelector('.text-content');
  if (!container) {
    container = document.createElement('div');
    container.className = 'text-content';
    bubble.appendChild(container);
  }
  return container;
}

function renderMessageContent(bubble, role, content) {
  if (role === 'bot') renderAnswerText(ensureTextContainer(bubble), content);
  else bubble.textContent = content;
}

function appendAnswerImage(bubble, image) {
  if (!image || typeof image.data !== 'string' ||
      !['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(image.mime_type)) return;
  let gallery = bubble.querySelector('.answer-images');
  if (!gallery) {
    gallery = document.createElement('div');
    gallery.className = 'answer-images';
    bubble.appendChild(gallery);
  }
  const figure = document.createElement('figure');
  figure.className = 'answer-image';
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = String(image.alt || 'Knowledge-base image');
  img.src = `data:${image.mime_type};base64,${image.data}`;
  figure.appendChild(img);
  if (image.alt) {
    const caption = document.createElement('figcaption');
    caption.textContent = String(image.alt);
    figure.appendChild(caption);
  }
  gallery.appendChild(figure);
}

function loadHistory() {
  const data = localStorage.getItem(historyKey);
  if (data) {
    try {
      currentChat = validMessages(JSON.parse(data));
    } catch(e) {
      currentChat = [];
    }
  }
  renderChat();
}

function renderChat() {
  chatHistory.replaceChildren(welcome);
  welcome.hidden = currentChat.length > 0;
  currentChat.forEach(msg => {
    const d = document.createElement('div');
    d.className = 'bubble ' + msg.role;
    renderMessageContent(d, msg.role, msg.content);
    if (msg.role === 'bot') {
      (msg.images || []).forEach(image => appendAnswerImage(d, image));
      if (msg.status === 'interrupted' || msg.status === 'streaming') {
        const state = document.createElement('p');
        state.className = 'message-state';
        state.dataset.i18n = msg.status === 'streaming' ? 'historyInProgress' : 'historyInterrupted';
        state.textContent = historyText(state.dataset.i18n);
        d.appendChild(state);
      }
    }
    chatHistory.appendChild(d);
  });
  scrollToBottom();
}

function addMessage(role, content) {
  welcome.hidden = true;
  currentChat.push({role, content});
  saveHistory();
  const d = document.createElement('div');
  d.className = 'bubble ' + role;
  renderMessageContent(d, role, content);
  chatHistory.appendChild(d);
  scrollToBottom();
  return d;
}

function clearChat() {
  currentChat = [];
  saveHistory();
  renderChat();
}

function scrollToBottom() {
  chatHistory.scrollTop = chatHistory.scrollHeight;
}

function translateUI() {
  const t = i18n[currentLang] || i18n['en'];
  document.title = t.title;
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) {
      if (key === 'healthChecking' || key === 'healthOnline' || key === 'healthOffline') return;
      el.textContent = t[key];
    }
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    if (t[key]) {
      el.setAttribute('title', t[key]);
    }
  });
  question.placeholder = t.placeholder;
  document.querySelectorAll('[data-i18n-aria]').forEach(element => {
    element.setAttribute('aria-label', t[element.dataset.i18nAria] || i18n.en[element.dataset.i18nAria]);
  });
  team.setAttribute('aria-label', t.teamLabel);
  language.setAttribute('aria-label', t.langLabel);
  updateHistoryUI();
  updateHealthStatus();
}

const allowedTeams=__ALLOWED_TEAMS__;
const robots=__ROBOTS__;
const allOp = document.createElement('option');
allOp.value = 'all';
allOp.setAttribute('data-i18n', 'allRobots');
team.appendChild(allOp);
function robotLabel(robot){return currentLang==='zh-CN'||currentLang==='zh-TW'?robot.chinese_name:robot.english_name}
function renderRobotOptions(){const selected=team.value||localStorage.getItem(teamKey)||'all';team.replaceChildren(allOp);robots.forEach(robot=>{const op=document.createElement('option');op.value=robot.name;op.textContent=robotLabel(robot);team.appendChild(op)});team.value=[...team.options].some(op=>op.value===selected)?selected:'all'}
renderRobotOptions();

function newConversationId(){return 'web:'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));}
function getConversationId(){if(historyAccount)return accountConversationId;let id=localStorage.getItem(conversationKey);if(!id){id=newConversationId();localStorage.setItem(conversationKey,id)}return id;}

language.value=i18n[localStorage.getItem(languageKey)] ? localStorage.getItem(languageKey) : 'zh-CN';

language.addEventListener('change',()=>{
  currentLang = language.value;

  renderRobotOptions();

if(localStorage.getItem(teamKey) && (allowedTeams.includes(localStorage.getItem(teamKey)) || localStorage.getItem(teamKey) === 'all')){

}else {
  team.value='all';
}
team.addEventListener('change',()=>localStorage.setItem(teamKey,team.value));
function updateHealthStatus() {
  const t = i18n[currentLang] || i18n['en'];
  health.textContent = workerOnline ? t.healthOnline : t.healthOffline;
  health.className = 'health ' + (workerOnline ? 'on' : 'off');

async function checkHealth(){
  try{
    const r=await fetch('/health');
    const d=await r.json();
    workerOnline = !!d.worker_online;
  }catch{
    workerOnline = false;
  }
  updateHealthStatus();

checkHealth();setInterval(checkHealth,5000);

async function submitQuestion(){
  if(askButton.disabled)return;
  if (!historyReady) {
    await initializeHistory();
    if (!historyReady) return;
  }
  const q=question.value.trim();
  if(!q)return;
  setHistoryLoading(true);
  try {
    if (!await verifyHistorySession()) return;
  } catch {
    setHistoryNotice('historyLoadError');
    setHistoryLoading(false);
    return;
  }
  setHistoryNotice('');
  const priorConversation=currentChat
    .filter(message=>message&&['user','bot'].includes(message.role)&&typeof message.content==='string')
    .slice(-12)
    .map(message=>({role:message.role,content:message.content}));

  askButton.disabled=true;
  newConversationButton.disabled=true;
  mobileNewConversation.disabled=true;
  team.disabled=true;
  language.disabled=true;
  chatHistory.setAttribute('aria-busy', 'true');
  question.value='';
  resizeQuestion();

  addMessage('user', q);
  const botBubble = addMessage('bot', '');
  const streamStatus = document.createElement('div');
  streamStatus.className = 'stream-status';
  const streamSpinner = document.createElement('span');
  streamSpinner.className = 'stream-spinner';
  streamSpinner.setAttribute('role', 'status');
  streamSpinner.setAttribute('aria-label', 'Waiting for answer');
  streamStatus.appendChild(streamSpinner);
  botBubble.appendChild(streamStatus);
  const hideStreamSpinner = () => streamStatus.remove();
  let accumulatedText = "";

  try{
    const r=await fetch('/ask',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'text/event-stream',
        ...(historyAccount ? {'X-CSRF-Token': historyAccount.csrf_token} : {})},
      body:JSON.stringify({
        question:q,
        language:language.value,
        team:team.value,
        conversation_id:getConversationId(),
        history:priorConversation
      })
    });

    if(!r.ok) {
      const d=await r.json();
      hideStreamSpinner();
      accumulatedText = d.error || 'Request failed';
      renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
      if (r.status === 401 || r.status === 403) await verifyHistorySession();
      return;
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let done = false;
    let buffer = "";

    while(!done) {
      const { value, done: readerDone } = await reader.read();
      done = readerDone;
      if (value) {
        buffer += decoder.decode(value, { stream: !done });
        buffer = buffer.replace(/\r\n?/g, "\n");
        const frames = buffer.split("\n\n");
        buffer = frames.pop();

        for (const frame of frames) {
          const data = frame.split("\n")
            .filter(line=>line.startsWith('data:'))
            .map(line=>line.slice(5).trimStart())
            .join("\n");
          if (!data) continue;
          try {
            const event = JSON.parse(data);

            if (event.status === "metadata") {
              if(event.conversation_id) {
                setConversationId(event.conversation_id);
                saveHistory();
              }
              continue;
            }

            if (event.status === "error") {
              hideStreamSpinner();
              renderAnswerText(ensureTextContainer(botBubble), event.error);
              accumulatedText = event.error;
              break;
            }

            if (event.status === "done") {
              hideStreamSpinner();
              renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
              scrollToBottom();
              continue;
            }

            if (typeof event.replace_text === 'string') {
              hideStreamSpinner();
              accumulatedText = event.replace_text;
              renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
            }

            if (event.image && typeof event.image.data === 'string') {
              const allowedTypes = new Set(['image/png','image/jpeg','image/gif','image/webp']);
              if (allowedTypes.has(event.image.mime_type) && shouldShowConversationImage(event.image)) {
                appendAnswerImage(botBubble, event.image);
                if (historyAccount) {
                  const message = currentChat[currentChat.length - 1];
                  (message.images ||= []).push(event.image);
                }
              }
            }

            if (event.text) {
              hideStreamSpinner();
              accumulatedText += event.text;
              renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
            }
            scrollToBottom();
          } catch(e) {
            console.error("Failed to parse SSE event", data, e);
          }
        }
      }
    }

  }catch(e){
    hideStreamSpinner();
    const t = i18n[currentLang] || i18n['en'];
    accumulatedText = t.genericError || 'An error occurred. Please try again.';
    renderAnswerText(ensureTextContainer(botBubble), accumulatedText);
  }finally{
    hideStreamSpinner();
    if (currentChat.length > 0 && currentChat[currentChat.length - 1].role === 'bot') {
      currentChat[currentChat.length - 1].content = accumulatedText || 'No response';
      saveHistory();
    }
    askButton.disabled=false;
    newConversationButton.disabled=false;
    mobileNewConversation.disabled=false;
    team.disabled=false;
    language.disabled=false;
    chatHistory.setAttribute('aria-busy', 'false');
    setHistoryLoading(false);
    if (historyAccount) {
      try { await refreshAccountHistory(); }
      catch { setHistoryNotice('historyLoadError'); }
    }
  }
}
document.getElementById('askForm').addEventListener('submit', event => {
  event.preventDefault();
  submitQuestion();
});
function resizeQuestion() {
  question.style.height = 'auto';
  const maxHeight = parseFloat(getComputedStyle(question).lineHeight) * 4;
  question.style.height = Math.min(question.scrollHeight, maxHeight) + 'px';
  question.style.overflowY = question.scrollHeight > maxHeight ? 'auto' : 'hidden';
}
question.addEventListener('input', resizeQuestion);
question.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    submitQuestion();
  }
});
newConversationButton.onclick=async()=>{
  if (askButton.disabled) return;
  if (!historyReady) {
    await initializeHistory();
    if (!historyReady) return;
  }
  saveHistory();
  setConversationId(historyAccount ? '' : newConversationId());
  hasOlderTurns = false;
  olderTurnId = null;
  updateHistoryUI();
  shownImageFingerprints = new Set();
  transientImageKeys = new Set();
  saveShownImageFingerprints();
  clearChat();
  question.value='';
  resizeQuestion();
  setMobileMenu(false);
  question.focus()
};
mobileNewConversation.onclick=()=>newConversationButton.click();
document.querySelectorAll('[data-suggestion]').forEach(button => {
  button.addEventListener('click', () => {
    if (askButton.disabled) return;
    question.value = i18n[currentLang][button.dataset.suggestion];
    resizeQuestion();
    submitQuestion();
  });
});

const sidebar = document.getElementById('conversationSidebar');
const mobileMenu = document.getElementById('mobileMenu');
const mobileScrim = document.getElementById('mobileScrim');
const mobileViewport = window.matchMedia('(max-width: 760px)');
function setMobileMenu(open) {
  open = Boolean(open && mobileViewport.matches);
  const wasOpen = sidebar.classList.contains('is-open');
  sidebar.classList.toggle('is-open', open);
  mobileScrim.classList.toggle('is-visible', open);
  mobileMenu.setAttribute('aria-expanded', String(open));
  document.getElementById('mainPanel').inert = open;
  if (open) document.getElementById('closeSidebar').focus();
  else if (wasOpen) mobileMenu.focus();
}
mobileMenu.onclick=()=>setMobileMenu(true);
mobileScrim.onclick=()=>setMobileMenu(false);
document.getElementById('closeSidebar').onclick=()=>setMobileMenu(false);
mobileViewport.addEventListener('change', ()=>setMobileMenu(false));
document.getElementById('newChatShortcut').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘ K' : 'Ctrl K';
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    newConversationButton.click();
  }
  if (!sidebar.classList.contains('is-open')) return;
  if (event.key === 'Escape') { event.preventDefault(); setMobileMenu(false); }
  if (event.key === 'Tab') {
    const focusable = [...sidebar.querySelectorAll('a, button:not(:disabled)')]
      .filter(element => element.getClientRects().length > 0 && !element.hidden);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});

// Init
translateUI();
initializeHistory();
resizeQuestion();
document.getElementById('importHistory').onclick = importBrowserConversations;
document.getElementById('moreConversations').onclick = () => loadMoreHistory(false);
document.getElementById('olderMessages').onclick = () => loadMoreHistory(true);
async function refreshHistorySession() {
  if (!historyReady || historyLoading || askButton.disabled) return;
  try {
    if (await verifyHistorySession() && historyAccount) await refreshAccountHistory();
  } catch { setHistoryNotice('historyLoadError'); }
}
window.addEventListener('focus', refreshHistorySession);
window.addEventListener('pageshow', event => { if (event.persisted) refreshHistorySession(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshHistorySession();
});
