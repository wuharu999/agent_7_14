<style>
#bg-graph {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  opacity: 0.15;
  pointer-events: none;
}
</style>
<canvas id="bg-graph"></canvas>
<script>
(function() {
  const canvas = document.getElementById('bg-graph');
  const ctx = canvas.getContext('2d');
  let width = 0; let height = 0;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let graphReady = false;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * pixelRatio;
    canvas.height = height * pixelRatio;
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    if (reducedMotion && graphReady) draw(0);
  }
  window.addEventListener('resize', resize);
  resize();

  const nodes = [
    { id: 0, label: '优必选', radius: 36, x: width/2, y: height/2, vx: 0, vy: 0 },
    { id: 1, label: 'walker S2', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 2, label: 'walkerC1', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 3, label: '控制中心', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 4, label: 'ROSA', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 5, label: '天工', radius: 32, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 6, label: '无疆', radius: 32, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 7, label: '思考者工作室', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 8, label: 'cosmos', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 9, label: 'mujoco', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 10, label: '强化学习', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 11, label: '模仿学习', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 12, label: '仿真到真实', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 13, label: '计算机视觉', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 14, label: 'SLAM', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 15, label: '具身智能', radius: 32, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 16, label: '逆运动学', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 17, label: '感知与抓取', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 18, label: '深度学习', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 19, label: 'Transformer', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 20, label: '运动规划', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 21, label: '目标检测', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 22, label: 'Policy Gradient', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 23, label: 'Soft Actor-Critic', radius: 22, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 24, label: 'Kinesthetic Teaching', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 25, label: 'State Estimation', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 26, label: '传感器融合', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 27, label: '行为克隆', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 }
  ];

  const shapes = ['circle', 'capsule', 'diamond', 'hexagon', 'organic'];
  nodes.forEach((n, index) => {
    n.shape = shapes[index % shapes.length];
    n.phase = Math.random() * Math.PI * 2;
    n.driftRate = 0.00025 + Math.random() * 0.0002;
    n.vx = (Math.random() - 0.5) * 0.9;
    n.vy = (Math.random() - 0.5) * 0.9;
  });

  const links = [
    { source: 0, target: 1 }, { source: 0, target: 2 }, { source: 0, target: 4 },
    { source: 1, target: 3 }, { source: 2, target: 3 }, { source: 0, target: 5 },
    { source: 5, target: 6 }, { source: 4, target: 7 }, { source: 5, target: 8 },
    { source: 1, target: 9 }, { source: 2, target: 9 },
    { source: 9, target: 12 }, { source: 10, target: 11 }, { source: 15, target: 10 },
    { source: 15, target: 13 }, { source: 1, target: 16 }, { source: 2, target: 16 },
    { source: 15, target: 14 }, { source: 13, target: 17 },
    { source: 18, target: 19 }, { source: 10, target: 22 }, { source: 22, target: 23 },
    { source: 15, target: 18 }, { source: 13, target: 21 }, { source: 11, target: 24 },
    { source: 11, target: 27 }, { source: 14, target: 25 }, { source: 25, target: 26 }
  ];

  let previousTime = 0;
  function update(time) {
    const delta = previousTime ? Math.min(2, (time - previousTime) / 16.667) : 1;
    previousTime = time;

    // Connected nodes act like loose constellations: springs preserve their
    // spacing while velocity alignment makes neighboring bubbles drift together.
    links.forEach(link => {
      const source = nodes[link.source];
      const target = nodes[link.target];
      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const distance = Math.max(1, Math.hypot(dx, dy));
      const preferredDistance = 115 + (source.radius + target.radius) * 0.8;
      const spring = (distance - preferredDistance) * 0.00032 * delta;
      source.vx += (dx / distance) * spring;
      source.vy += (dy / distance) * spring;
      target.vx -= (dx / distance) * spring;
      target.vy -= (dy / distance) * spring;

      const sharedVx = (source.vx + target.vx) / 2;
      const sharedVy = (source.vy + target.vy) / 2;
      const alignment = 0.018 * delta;
      source.vx += (sharedVx - source.vx) * alignment;
      source.vy += (sharedVy - source.vy) * alignment;
      target.vx += (sharedVx - target.vx) * alignment;
      target.vy += (sharedVy - target.vy) * alignment;
    });

    nodes.forEach(n => {
      n.vx += Math.cos(time * n.driftRate + n.phase) * 0.0025 * delta;
      n.vy += Math.sin(time * n.driftRate + n.phase) * 0.0025 * delta;
      n.vx *= Math.pow(0.997, delta);
      n.vy *= Math.pow(0.997, delta);
      const speed = Math.hypot(n.vx, n.vy);
      if (speed > 0.82) {
        n.vx = n.vx / speed * 0.82;
        n.vy = n.vy / speed * 0.82;
      }
      n.x += n.vx * delta;
      n.y += n.vy * delta;
      
      // Bounce off walls
      const edgeRadius = n.shape === 'capsule' ? n.radius * 1.3 : n.radius;
      if (n.x < edgeRadius || n.x > width - edgeRadius) {
        n.vx *= -1;
        n.x = Math.max(edgeRadius, Math.min(width - edgeRadius, n.x));
      }
      if (n.y < n.radius || n.y > height - n.radius) {
        n.vy *= -1;
        n.y = Math.max(n.radius, Math.min(height - n.radius, n.y));
      }
    });
  }

  function nodePath(n, time) {
    const r = n.radius;
    ctx.beginPath();
    if (n.shape === 'capsule') {
      const halfWidth = r * 1.28;
      const halfHeight = r * 0.72;
      ctx.moveTo(n.x - halfWidth + halfHeight, n.y - halfHeight);
      ctx.lineTo(n.x + halfWidth - halfHeight, n.y - halfHeight);
      ctx.quadraticCurveTo(n.x + halfWidth, n.y - halfHeight, n.x + halfWidth, n.y);
      ctx.quadraticCurveTo(n.x + halfWidth, n.y + halfHeight, n.x + halfWidth - halfHeight, n.y + halfHeight);
      ctx.lineTo(n.x - halfWidth + halfHeight, n.y + halfHeight);
      ctx.quadraticCurveTo(n.x - halfWidth, n.y + halfHeight, n.x - halfWidth, n.y);
      ctx.quadraticCurveTo(n.x - halfWidth, n.y - halfHeight, n.x - halfWidth + halfHeight, n.y - halfHeight);
    } else if (n.shape === 'diamond') {
      ctx.moveTo(n.x, n.y - r);
      ctx.lineTo(n.x + r * 0.9, n.y);
      ctx.lineTo(n.x, n.y + r);
      ctx.lineTo(n.x - r * 0.9, n.y);
    } else if (n.shape === 'hexagon') {
      for (let point = 0; point < 6; point += 1) {
        const angle = Math.PI / 3 * point - Math.PI / 6;
        const x = n.x + Math.cos(angle) * r;
        const y = n.y + Math.sin(angle) * r;
        if (point === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    } else if (n.shape === 'organic') {
      const pulse = 1 + Math.sin(time * 0.0008 + n.phase) * 0.045;
      ctx.moveTo(n.x, n.y - r * 0.92 * pulse);
      ctx.bezierCurveTo(n.x + r, n.y - r, n.x + r * 1.08, n.y - r * 0.05, n.x + r * 0.82, n.y + r * 0.52);
      ctx.bezierCurveTo(n.x + r * 0.45, n.y + r * 1.05, n.x - r * 0.55, n.y + r, n.x - r * 0.88, n.y + r * 0.35);
      ctx.bezierCurveTo(n.x - r * 1.05, n.y - r * 0.2, n.x - r * 0.7, n.y - r * 0.85, n.x, n.y - r * 0.92 * pulse);
    } else {
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    }
    ctx.closePath();
  }

  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    ctx.lineWidth = 1.5;
    links.forEach(link => {
      ctx.beginPath();
      ctx.moveTo(nodes[link.source].x, nodes[link.source].y);
      ctx.lineTo(nodes[link.target].x, nodes[link.target].y);
      ctx.strokeStyle = 'rgba(37, 99, 235, 0.2)';
      ctx.stroke();
    });
    nodes.forEach(n => {
      nodePath(n, time);
      ctx.fillStyle = '#2563eb';
      ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.font = '500 15px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(n.label, n.x, n.y + n.radius + 18);
    });
  }
  graphReady = true;
  function loop(time) { update(time); draw(time); requestAnimationFrame(loop); }
  if (reducedMotion) draw(0); else requestAnimationFrame(loop);
})();
</script>
