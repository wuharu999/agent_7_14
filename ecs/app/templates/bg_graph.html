<style>
#bg-graph {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  opacity: 0.15;
  pointer-events: none;
}
</style>
<canvas id="bg-graph"></canvas>
<script>
(function() {
  const canvas = document.getElementById('bg-graph');
  const ctx = canvas.getContext('2d');
  let width = 0; let height = 0;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  window.addEventListener('resize', resize);
  resize();

  const nodes = [
    { id: 0, label: '优必选', radius: 36, x: width/2, y: height/2, vx: 0, vy: 0 },
    { id: 1, label: 'walker S2', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 2, label: 'walkerC1', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 3, label: '控制中心', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 4, label: 'ROSA', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 5, label: '天工', radius: 32, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 6, label: '无疆', radius: 32, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 7, label: '思考者工作室', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 8, label: 'cosmos', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 9, label: 'mujuco', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 10, label: '强化学习', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 11, label: '模仿学习', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 12, label: '仿真到真实', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 13, label: '计算机视觉', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 14, label: 'SLAM', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 15, label: '具身智能', radius: 32, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 16, label: '逆运动学', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 17, label: '感知与抓取', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 18, label: '深度学习', radius: 30, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 19, label: 'Transformer', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 20, label: '运动规划', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 21, label: '目标检测', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 22, label: 'Policy Gradient', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 23, label: 'Soft Actor-Critic', radius: 22, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 24, label: 'Kinesthetic Teaching', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 25, label: 'State Estimation', radius: 26, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 26, label: '传感器融合', radius: 28, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 },
    { id: 27, label: '行为克隆', radius: 24, x: Math.random()*width, y: Math.random()*height, vx: 0, vy: 0 }
  ];

  // Give them all initial random velocities for constant float
  nodes.forEach(n => {
    n.vx = (Math.random() - 0.5) * 1.5;
    n.vy = (Math.random() - 0.5) * 1.5;
  });

  const links = [
    { source: 0, target: 1 }, { source: 0, target: 2 }, { source: 0, target: 4 },
    { source: 1, target: 3 }, { source: 2, target: 3 }, { source: 0, target: 5 },
    { source: 5, target: 6 }, { source: 4, target: 7 }, { source: 5, target: 8 },
    { source: 1, target: 9 }, { source: 2, target: 9 },
    { source: 9, target: 12 }, { source: 10, target: 11 }, { source: 15, target: 10 },
    { source: 15, target: 13 }, { source: 1, target: 16 }, { source: 2, target: 16 },
    { source: 15, target: 14 }, { source: 13, target: 17 },
    { source: 18, target: 19 }, { source: 10, target: 22 }, { source: 22, target: 23 },
    { source: 15, target: 18 }, { source: 13, target: 21 }, { source: 11, target: 24 },
    { source: 11, target: 27 }, { source: 14, target: 25 }, { source: 25, target: 26 }
  ];

  function update() {
    nodes.forEach(n => {
      n.x += n.vx;
      n.y += n.vy;
      
      // Bounce off walls
      if (n.x < n.radius || n.x > width - n.radius) {
        n.vx *= -1;
        n.x = Math.max(n.radius, Math.min(width - n.radius, n.x));
      }
      if (n.y < n.radius || n.y > height - n.radius) {
        n.vy *= -1;
        n.y = Math.max(n.radius, Math.min(height - n.radius, n.y));
      }
    });
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.lineWidth = 1.5;
    links.forEach(link => {
      ctx.beginPath();
      ctx.moveTo(nodes[link.source].x, nodes[link.source].y);
      ctx.lineTo(nodes[link.target].x, nodes[link.target].y);
      ctx.strokeStyle = 'rgba(37, 99, 235, 0.2)';
      ctx.stroke();
    });
    nodes.forEach(n => {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#2563eb';
      ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.font = '500 15px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(n.label, n.x, n.y + n.radius + 18);
    });
  }
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
})();
</script>
