<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户设置</title><link rel="stylesheet" href="/static/account_menu.css"><script src="/static/account_menu.js?v=20260814-2" defer></script>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;background:#f5f7fb;color:#172033}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{margin-top:20px;background:#fff;border:1px solid #dbe2ee;border-radius:14px;padding:24px}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px}input[aria-invalid="true"]{border-color:#dc2626}.field-error{margin:6px 0 0;color:#b91c1c;font-size:13px;font-weight:600}button{margin-top:18px;padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.muted{color:#64748b;font-size:13px}.message{margin-top:14px;padding:10px;border-radius:8px}.message.ok{background:#f0fdf4;color:#166534}.message.error{background:#fff1f2;color:#b91c1c}</style>
</head><body>
<div class="top"><div><h1>用户设置</h1><p class="muted">当前用户：__USERNAME__</p></div><div data-account-menu data-account-return="/settings"></div></div>
<div class="card"><h2>邮箱与密码</h2><p class="muted">为保护账户安全，保存时必须输入当前密码。</p><form id="settings-form"><label for="email">电子邮箱</label><input id="email" type="email" required><label for="current-password">当前密码</label><input id="current-password" type="password" required minlength="10" autocomplete="current-password" aria-describedby="current-password-error"><p id="current-password-error" class="field-error" role="alert" hidden></p><label for="new-password">新密码（留空则不修改）</label><input id="new-password" type="password" minlength="10" autocomplete="new-password"><button type="submit">保存设置</button></form><div id="message" hidden></div></div>
<script>const csrfToken='__CSRF_TOKEN__';const form=document.getElementById('settings-form'),message=document.getElementById('message'),emailInput=document.getElementById('email'),currentPasswordInput=document.getElementById('current-password'),currentPasswordError=document.getElementById('current-password-error');function clearCurrentPasswordError(){currentPasswordError.hidden=true;currentPasswordError.textContent='';currentPasswordInput.removeAttribute('aria-invalid')}currentPasswordInput.addEventListener('input',clearCurrentPasswordError);fetch('/api/me').then(r=>r.json()).then(data=>{emailInput.value=data.email||''});form.addEventListener('submit',async event=>{event.preventDefault();message.hidden=true;clearCurrentPasswordError();try{const response=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({email:emailInput.value,current_password:currentPasswordInput.value,new_password:document.getElementById('new-password').value||null})});const data=await response.json();if(!response.ok)throw new Error(data.error||'保存失败');currentPasswordInput.value='';document.getElementById('new-password').value='';message.className='message ok';message.textContent='设置已保存。'}catch(error){const errorText=String(error.message||error);if(errorText==='Current password is incorrect'){currentPasswordError.textContent='当前密码不正确，请重新输入。';currentPasswordError.hidden=false;currentPasswordInput.setAttribute('aria-invalid','true');currentPasswordInput.focus()}message.className='message error';message.textContent=errorText}message.hidden=false});</script>
</body></html>
